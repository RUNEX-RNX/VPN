        document.getElementById('socialBtn').addEventListener('click', showSocial);
        document.getElementById('backBtn').addEventListener('click', showMain);

        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.page === 'social') {
                showSocial();
            } else {
                showMain();
            }
        });

        if (window.location.pathname.endsWith('/social')) {
            showSocial();
        }

        // ============================================================
        // 4. КНОПКА КОПИРОВАНИЯ
        // ============================================================
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        let toastTimeout;

        copyBtn.addEventListener('click', function() {
            const url = 'https://runex-rnx.github.io/VPN/';
            
            // Современный способ копирования
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('✅ Ссылка скопирована!');
                }).catch(() => {
                    fallbackCopy(url);
                });
            } else {
                fallbackCopy(url);
            }
        });

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ Ссылка скопирована!');
            } catch (err) {
                showToast('❌ Не удалось скопировать');
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    }
</script>
</body>
</html>
